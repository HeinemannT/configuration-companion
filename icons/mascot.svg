<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Configuration Companion">
  <!-- hello-1: leaning hello. Closed happy eyes, open grin, mitten wave, motion arcs.
       Construction: one circle, centre (60 68), centreline r31, stroke 34 (outer 48, counter 14),
       round terminals at +-52 deg. The whole figure leans 10 deg about its base point (60 116). -->
  <g transform="translate(11.4 9.6) scale(.9) rotate(10 60 116)">

    <!-- motion arcs: concentric with the hand -->
    <g fill="none" stroke="#8a3ffc" stroke-width="4.5" stroke-linecap="round">
      <path d="M4.4 27 A16 16 0 0 1 4.4 11"/>
      <path d="M-3 31 A24 24 0 0 1 -3 7"/>
    </g>

    <!-- arm: short and chubby, grows out of the upper-left of the body -->
    <g>
      <path d="M38 46 L23 27" fill="none" stroke="#8a3ffc" stroke-width="15" stroke-linecap="round"/>
      <!-- mitten, tilted mid-wave; thumb points in towards the head -->
      <g transform="translate(18 19) rotate(-22)" fill="#f472d0">
        <rect x="-9" y="-13" width="18" height="25" rx="9"/>
        <path d="M4.5 7.5 L12 5" stroke="#f472d0" stroke-width="7.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- body: an even, chunky C -->
    <g>
      <path d="M79.1 43.6 A31 31 0 1 0 79.1 92.4" fill="none" stroke="#8a3ffc" stroke-width="34" stroke-linecap="round"/>
      <!-- one soft highlight on the crown -->
      <path d="M54 26 A42 42 0 0 1 70 27" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- face, on the broad left side -->
    <g>
      <g fill="none" stroke="#1c1033" stroke-width="4.5" stroke-linecap="round">
        <path d="M17 64 Q22 56 27 64"/>
        <path d="M34 64 Q39 56 44 64"/>
      </g>
      <path d="M22.5 71 Q30.5 73 38.5 71 Q37 85 30.5 85 Q24 85 22.5 71 Z" fill="#1c1033" stroke="#1c1033" stroke-width="2" stroke-linejoin="round"/>
      <ellipse cx="30.5" cy="81.5" rx="5" ry="3" fill="#f472d0"/>
      <ellipse cx="15" cy="72.5" rx="3.6" ry="2.4" fill="#f472d0"/>
      <ellipse cx="45" cy="73" rx="3.2" ry="2.4" fill="#f472d0"/>
    </g>
  </g>
</svg>
