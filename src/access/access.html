<!doctype html>
<html lang="en" data-theme="crev-light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="../../icons/mark-16.svg">
  <title>Companion · Access</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="access-base.css">
  <link rel="stylesheet" href="pbac-highlighting.css">
  <link rel="stylesheet" href="access-test.css">
  <link rel="stylesheet" href="access-performance.css">
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="access-workspace.css">
</head>

<body>
  <div id="connection-banner" role="status" hidden></div>
  <div id="access-busy" role="status" hidden></div>
  <div class="workspace">
    <header class="topbar ui">
      <div class="topbar-tools">
        <button class="icon-button sidebar-toggle" data-command="explorer" aria-label="Show or hide the lists"
          title="Show or hide the lists (Ctrl+B)"></button>
        <span class="topbar-title"><strong>Access</strong><span id="environment-name" class="ui-id"></span></span>
        <div class="surface-switch" role="group" aria-label="Surface">
          <button type="button" data-command="editor-surface" aria-pressed="true">Editor</button>
          <button type="button" class="matrix-launch" data-command="matrix" aria-pressed="false">Matrix</button>
        </div>
        <span class="spacer"></span>
        <div id="pending-review" class="dirty-bar" aria-live="polite"></div>
        <div class="history-actions"><button class="icon-button" data-command="undo" aria-label="Undo" title="Undo"></button><button
            class="icon-button" data-command="redo" aria-label="Redo" title="Redo"></button><button class="icon-button" data-command="history"
            aria-label="History" title="Edit history"></button></div>
        <span class="topbar-sep" aria-hidden="true"></span>
        <button class="icon-button topbar-more" data-command="topbar-more" aria-haspopup="menu"
          aria-label="More: performance, shortcuts and help" title="More: performance, shortcuts and help"><span data-icon="more"></span></button>
        <button class="icon-button context-toggle" data-command="context-panel" aria-controls="context-panel" aria-expanded="true"
          aria-label="Details panel" title="Show or hide the details panel"><span data-icon="panel"></span></button>
      </div>
      <div class="topbar-records">
        <button class="icon-button" data-command="navigate-back" aria-label="Go back" title="Go back (Alt+Left)"></button>
        <button class="icon-button" data-command="navigate-forward" aria-label="Go forward" title="Go forward (Alt+Right)"></button>
        <div id="tabs" class="document-tabs" aria-label="Open records"></div>
      </div>
    </header>
    <aside class="explorer ui" aria-label="Roles and policies">
      <div class="explorer-controls">
        <div class="search ui-search"><span data-icon="search"></span><input id="search" placeholder="Find name, ID or policy text…"
            aria-label="Find a role or policy"><button id="search-clear" data-command="clear-search" class="icon-button"
            title="Clear search" aria-label="Clear search" hidden><span data-icon="close"></span></button></div>
        <div id="search-scopes" class="seg" role="group" aria-label="Show in the lists"></div>
        <div id="search-filter"></div>
      </div>
      <div id="tree" aria-label="Configuration collections"></div>
    </aside>
    <button class="sidebar-backdrop" data-command="explorer" aria-label="Close the lists"></button>
    <div class="splitter" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize sidebar"></div>
    <main class="workarea">
      <div id="editor" class="editor" tabindex="-1"></div>
      <section id="dock" class="context-test" aria-label="Access test" hidden></section>
    </main>
    <aside id="context-panel" class="context-panel ui" aria-label="Details" hidden></aside>
    <footer class="statusbar ui"><span id="selection-kind">Role</span><span class="status-divider"></span><span id="saved-scope"></span><span
        class="status-divider"></span><span id="status" role="status" aria-live="polite">Ready</span><span class="spacer"></span><button
        data-command="about">Connection</button></footer>
  </div>
  <dialog id="dialog">
    <form id="dialog-form">
      <div id="dialog-content"></div>
    </form>
  </dialog>
  <div id="menu" class="popup-menu" hidden></div>
  <script type="module" src="access.ts"></script>
</body>

</html>
